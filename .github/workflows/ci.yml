name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Test suite (CPU)
        run: pytest -m "not gpu and not slow"

      - name: Docs gate (anchors + coverage)
        run: python scripts/check_docs.py --coverage

      - name: HTML docs build artifact
        run: |
          python scripts/build_docs_html.py
          tar -cf docs_html.tar docs_html
      - uses: actions/upload-artifact@v4
        with:
          name: docs_html
          path: docs_html.tar
