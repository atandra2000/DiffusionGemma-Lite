pipeline:
  tokenizer:
    name: gpt2
    path: null
    vocab_size: 50257
    eos_token_id: 50256
    pad_token_id: 50256
  sharding:
    shard_size_tokens: 50000000
    dtype: uint32
    target_total_tokens: 8000000000
  dedup:
    enabled: true
  quality:
    drop_empty: true
    min_unique_chars_ratio: 0.05
    max_digit_ratio: 0.5
    max_punct_ratio: 0.5
    max_whitespace_ratio: 0.5
  tokenize:
    prefetch: 16
  pack:
    cross_document_boundary_ok: false
  seed: 42
_generator: DiffusionGemma-Lite/data/prepare_data.py
_tokenizer_family: gpt2
